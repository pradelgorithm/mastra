# CodeRabbit configuration. Reference: https://docs.coderabbit.ai/reference/configuration
# Checked against schema v2 (https://coderabbit.ai/integrations/schema.v2.json); keys are kept in the order the schema declares them.
# Everything here is advisory: no check can block a merge while `reviews.request_changes_workflow` is false.
language: en-US
tone_instructions: ''
early_access: false
enable_free_tier: true
reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_instructions: |
    Start the summary with an "ELI5" (Explain Like I'm 5) section at the very top that gives a simple, jargon-free explanation of what the PR does and why, in 1-3 sentences that anyone could understand.
  high_level_summary_placeholder: '@coderabbitai summary'
  high_level_summary_in_walkthrough: false
  auto_title_placeholder: '@coderabbitai'
  auto_title_instructions: ''
  review_status: true
  commit_status: true
  fail_commit_status: false
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: false
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  labeling_instructions: []
  auto_apply_labels: false
  suggested_reviewers: true
  auto_assign_reviewers: false
  in_progress_fortune: true
  poem: false
  path_filters: []
  # One source of truth per rule: each block carries only what is specific to its path and points at the AGENTS.md section that states the rule in full.
  path_instructions:
    - path: '.changeset/*.md'
      instructions: |
        Changeset files are really important for keeping track of changes in the project. They'll be used to generate release notes and inform users about updates.

        Review the changeset file according to these guidelines:
        - The target audience are developers
        - Write short, direct sentences that anyone can understand. Avoid technical jargon, and acronyms. Use action-oriented verbs (Added, Fixed, Improved, Deprecated, Removed)
        - Commit messages (e.g. "fix: correct minor typos") are not allowed as descriptions in changeset files.
        - Avoid generic phrases like "Update code", "Miscellaneous improvements", or "Bug fixes"
        - Highlight outcomes! What does change for the end user? Do not focus on internal implementation details
        - If the change is a breaking change or is adding a new feature, ensure that a short code example is provided. This code example should show the public API usage. Do not show code examples of internal implementation details.
        - For breaking changes, include short, concise before/after instructions (and use migration guides in the docs for the complete instructions)
        - Keep the formatting easy-to-read and scannable. If necessary, use bullet points or multiple paragraphs (Use **bold** text as the heading for these sections, do not use markdown headings).
        - Each changeset file contains a YAML frontmatter at the top. It will be one or more package names followed by a colon and the type of change (patch, minor, major). Do not modify this frontmatter. Check that the description inside the changeset file only applies to the packages listed in the frontmatter. Do not allow descriptions that mention changes to packages not listed in the frontmatter. In these cases, the user must create a separate changeset file for those packages.
        - Very long changesets in one file (with multiple packages in the frontmatter) are an anti-pattern. This will lead to multiple packages having really large changelog entries. This must be avoided.
        - If the changes span multiple packages and each change is different from another, you MUST create multiple changeset files. Otherwise you'll mix different changes into changeset files where they don't belong. For this you must decide what logical groups exist.
        - Test-only pull requests, and follow-ups whose behavior changeset already lives on the parent pull request, carry no changeset at all. Do not ask for one.
        - The code example may be omitted when the new option is deliberately accepted-but-ignored (a usage example would imply behavior it does not have) and for plain patch changes. Accept an explicitly stated exception instead of re-requesting the example.

        In case of a guideline violation ALWAYS mark your comment as `potential_issue`.
    - path: '**/*.{ts,tsx}'
      instructions: |
        For schema-backed executions, deterministic input and output contract validation belongs in `inputSchema`, `outputSchema`, or their schema fields—not inline in `execute`.

        Flag duplicated inline checks for payload shape, types, enum membership, ranges, formats, and cross-field invariants. Each finding must identify the inline validation and the schema where it belongs.

        Do not report checks that require runtime context or mutable/external state, including authorization, database or filesystem state, resource existence, conflicts, request context, or external-service responses; those belong in `execute`.
    - path: 'packages/core/src/stream/**'
      instructions: |
        Withhold a rejected retry attempt's text from the final output. Blanking a tripwired step's `text` is the intended contract, not a bug: do not suggest restoring it.
        Every output accessor must agree on what `result.text` contains. Flag a change that makes one accessor contradict another about the same result.
        Repo-wide and core conventions: root `AGENTS.md` § Review conventions and `packages/core/AGENTS.md` § Conventions.
    - path: 'packages/core/src/agent/**'
      instructions: |
        Abort is a property of the segment, not the run id. An aborted run must never re-seed a later lifecycle, and an abort check must never be broadened to reject every enqueue for that run id — later segments of the same run are legitimate.
        Express cancellation with a standard `AbortSignal` or `readable.cancel()` and a typed abort error. Never a bespoke stop method, never a tripwire.
        Repo-wide and core conventions: root `AGENTS.md` § Review conventions and `packages/core/AGENTS.md` § Conventions.
    - path: 'packages/core/src/loop/**'
      instructions: |
        A recovered, non-terminal retry attempt logs at `warn`; only terminal exhaustion logs at `error`.
        Bound the loop's iteration count with a named constant, and give every provider or subprocess call a default timeout or abort.
        Repo-wide and core conventions: root `AGENTS.md` § Review conventions and `packages/core/AGENTS.md` § Conventions.
    - path: 'packages/core/src/processors/**'
      instructions: |
        A processor rejection sets `MastraFinishReason` to `tripwire`, never `other` or `aborted`. A caller abort is never reported as a tripwire.
        Built-in processors go through the same public registry an external author would use. No hardcoded special cases, no internal-only APIs.
        Repo-wide and core conventions: root `AGENTS.md` § Review conventions and `packages/core/AGENTS.md` § Conventions.
    - path: 'packages/*/src/**/*.test.ts'
      instructions: |
        A regression test must fail on `main` — or with the fix reverted — and pass after it. Flag a test that would pass without the accompanying source change.
        Do not suggest deleting or loosening an existing assertion to make a source suggestion fit. An existing assertion is the pinned contract.
        Gate an async assertion on a real readiness event or `vi.waitFor`, never on a fixed sleep or timer.
        Repo-wide and core conventions: root `AGENTS.md` § Review conventions and `packages/core/AGENTS.md` § Conventions.
    - path: 'stores/**'
      instructions: |
        Storage behavior is pinned by the shared conformance suite running against a real database, not by unit tests that assert generated SQL strings.
        Every adapter implements identical semantics. Flag a change that makes one adapter define a record, an operator or a transfer differently from the others, and keep an adapter-specific option in that adapter's own params type.
        A new field on a shared storage type must be optional and nullable — older `@mastra/core` peers never send it, and needing a new core API means bumping peerDependencies.
        Repo-wide and core conventions: root `AGENTS.md` § Review conventions and `packages/core/AGENTS.md` § Conventions.
  abort_on_close: true
  disable_cache: false
  slop_detection:
    enabled: true
    label: 'slop'
  auto_review:
    enabled: true
    auto_incremental_review: true
    ignore_title_keywords: []
    labels: []
    drafts: false
    base_branches: []
    ignore_usernames:
      - daneatmastra
      - 'dane-ai-mastra[bot]'
  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true
  pre_merge_checks:
    docstrings:
      mode: warning
      threshold: 80
    title:
      mode: warning
      requirements: 'Title should be concise and descriptive, ideally under 50 characters. Avoid generic phrases like "Update code" or "Fix bug". Use imperative mood and proper capitalization.'
    description:
      mode: warning
    issue_assessment:
      mode: warning
    custom_checks: []
  tools:
    ast-grep:
      rule_dirs: []
      util_dirs: []
      essential_rules: true
      packages: []
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true
    github-checks:
      enabled: true
      # `timeout_ms` is no longer declared in schema v2 — the integration now exposes only `enabled`. Kept as set; drop it if CodeRabbit starts reporting it as unknown.
      timeout_ms: 90000
    languagetool:
      enabled: true
      enabled_rules: []
      disabled_rules: []
      enabled_categories: []
      disabled_categories: []
      enabled_only: false
      level: default
    biome:
      enabled: true
    hadolint:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    checkov:
      enabled: true
    eslint:
      enabled: true
    actionlint:
      enabled: true
    semgrep:
      enabled: true
    sqlfluff:
      enabled: true
    prismaLint:
      enabled: true
    oxc:
      enabled: true
    dotenvLint:
      enabled: true
    htmlhint:
      enabled: true
    checkmake:
      enabled: true
    osvScanner:
      enabled: true
chat:
  art: true
  auto_reply: true
  integrations:
    linear:
      usage: auto
knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    # Defaults already cover `**/AGENTS.md` (and so `packages/*/AGENTS.md`), `**/CLAUDE.md`, `**/AGENT.md` and `**/REVIEW.md`; nothing to add.
    filePatterns: []
  learnings:
    scope: auto
  issues:
    scope: auto
  linear:
    usage: auto
    team_keys: []
  pull_requests:
    scope: auto
  mcp:
    usage: auto
    disabled_servers: []
code_generation:
  docstrings:
    language: en-US
    path_instructions: []
  unit_tests:
    path_instructions: []
issue_enrichment:
  planning:
    enabled: true
